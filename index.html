<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная Карта MAX</title>
    <style>
        /* Растягиваем карту на весь экран смартфона */
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0b0c0e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            overflow: hidden;
        }

        /* Делаем карту ТЕМНОЙ с помощью CSS-фильтра (независимо от настроек Яндекса) */
        .ymaps-2-1-79-map {
            filter: invert(90%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }

        /* Выдвижная карточка события (шторка) */
        .bottom-card {
            position: absolute;
            bottom: -100%;
            left: 0;
            width: 100%;
            background-color: #0b0c0e;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            z-index: 9999;
            transition: bottom 0.3s ease-out;
            color: #ffffff;
            box-sizing: border-box;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }

        .bottom-card.active {
            bottom: 0;
        }

        .card-media {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #222;
        }

        .card-content {
            padding: 16px;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 4px;
            line-height: 1.4;
        }

        .card-geo {
            font-size: 13px;
            color: #8e8e93;
            margin-bottom: 16px;
        }

        .follow-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background-color: #1c1c1e;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .card-subtitle {
            font-size: 14px;
            font-weight: bold;
            color: #8e8e93;
            margin-bottom: 6px;
        }

        .card-text {
            font-size: 14px;
            color: #e5e5ea;
            line-height: 1.4;
        }

        .close-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            z-index: 1010;
        }
    </style>
    <!-- Подключаем стабильную версию API 2.1 с вашим ключом -->
    <script src="https://yandex.ru" type="text/javascript"></script>
</head>
<body>

    <div id="map"></div>

    <!-- Конструкция шторки происшествия -->
    <div id="eventCard" class="bottom-card">
        <button class="close-btn" onclick="closeCard()">×</button>
        <img id="cardImage" class="card-media" src="" alt="Медиа">
        <div class="card-content">
            <div id="cardTitle" class="card-title">Заголовок происшествия</div>
            <div id="cardGeo" class="card-geo">Адрес</div>
            <button class="follow-btn">🔔 Следить</button>
            <div class="card-subtitle">Кратко</div>
            <div id="cardText" class="card-text">Описание...</div>
        </div>
    </div>

    <script type="text/javascript">
        // Ожидаем загрузки Яндекса
        ymaps.ready(init);

        function init() {
            // Создаем карту с центром в Москве
            var myMap = new ymaps.Map("map", {
                center: [55.755814, 37.617635],
                zoom: 11,
                controls: [] // Отключаем лишние стандартные кнопки
            });

            // База данных ваших точек происшествий
            var points = [
                {
                    id: 1,
                    coords: [55.755814, 37.617635], // Координаты [широта, долгота] для v2.1
                    title: "Неизвестные подожгли автомобиль во дворе ЖК Мисайлово",
                    geo: "Ленинский городской округ, посёлок городского типа...",
                    text: "Поджигатели успели скрыться. На месте происшествия работают экстренные службы.",
                    image: "https://unsplash.com"
                }
            ];

            // Создаем кластеризатор для автоматической группировки в круги с цифрами
            var clusterer = new ymaps.Clusterer({
                preset: 'islands#darkClusterIcons', // Темный стиль кругов группировки
                groupByCoordinates: false,
                clusterDisableClickZoom: false
            });

            // Проходим по всем точкам и добавляем их на карту
            points.forEach(function(point) {
                var myPlacemark = new ymaps.Placemark(point.coords, {}, {
                    preset: 'islands#redCircleDotIconWithCaption', // Красный маркер-точка
                    iconColor: '#ff4500'
                });

                // Перехватываем клик по маркеру, чтобы красиво выдвинуть шторку приложения
                myPlacemark.events.add('click', function (e) {
                    e.preventDefault();
                    openCard(point);
                });

                clusterer.add(myPlacemark);
            });

            myMap.geoObjects.add(clusterer);
        }

        // Логика работы выдвижной карточки
        function openCard(data) {
            document.getElementById('cardTitle').innerText = data.title;
            document.getElementById('cardGeo').innerText = data.geo;
            document.getElementById('cardText').innerText = data.text;
            document.getElementById('cardImage').src = data.image;
            document.getElementById('eventCard').classList.add('active');
        }

        function closeCard() {
            document.getElementById('eventCard').classList.remove('active');
        }
    </script>
</body>
</html>
